name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: '22'
          cache: npm

      # `npm ci` fails if the lock and package.json disagree, so a stale lockfile
      # is a CI failure rather than a deploy-time surprise. Nothing here needs a
      # postinstall, hence --ignore-scripts.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # The credential-caching cases fail by TIMING OUT against the old code —
      # the bug made a load hang for the whole session rather than error.
      - name: Test
        run: npm test

      # `sdk-commands build` type-checks the scene graph too — composite
      # resolution and generated script types that `tsc -p .` alone misses.
      - name: Build
        run: npm run build

      # The keyed path is behind a flag, so the default build never compiles it —
      # a type error there would surface on the day someone flips it. No-ops on
      # branches without the flag.
      - name: Typecheck the non-default career storage mode
        run: |
          if grep -q "CAREER_STORAGE_MODE: CareerStorageMode = 'blob'" src/shared/config.ts; then
            sed -i "s/CAREER_STORAGE_MODE: CareerStorageMode = 'blob'/CAREER_STORAGE_MODE: CareerStorageMode = 'keyed'/" src/shared/config.ts
            npm run typecheck
            git checkout -- src/shared/config.ts
          else
            echo "CAREER_STORAGE_MODE not present on this branch — nothing to check."
          fi

  # Deploy hygiene — no dependency tree needed.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # .dclignore is the only thing keeping tests and CI config out of a deploy,
      # and shipping them is silent and permanent. Assert it rather than trust it.
      - name: Deploy excludes non-scene files
        run: |
          missing=0
          for entry in 'test/' 'vitest.config.ts' 'tsconfig.test.json' '.github/' 'backups/' 'node_modules/'; do
            if ! grep -qxF "$entry" .dclignore; then
              echo "::error file=.dclignore::missing required .dclignore entry: $entry"
              missing=1
            fi
          done
          exit $missing

      # The pin carries the multiplayer server runtime; a floating range would let
      # a stray install walk it onto an untested build. See UPGRADE-SDK.md.
      - name: SDK versions are pinned exactly
        run: |
          node -e '
            const dev = require("./package.json").devDependencies || {};
            const bad = Object.entries(dev).filter(([n, v]) =>
              n.startsWith("@dcl/") && /^[\^~]|\*|^latest$/.test(v));
            if (bad.length) {
              for (const [n, v] of bad) {
                console.error(`::error file=package.json::${n} must be an exact version, got "${v}"`);
              }
              process.exit(1);
            }
            console.log("all @dcl/* dependencies are exact pins");
          '

      # .gitignore does not list .env, so a committed one ships to the content
      # server. Credentials belong in world-scoped EnvVars.
      - name: No committed environment file
        run: |
          if ls -A .env .env.* 2>/dev/null | grep -q .; then
            echo "::error::an environment file is committed — credentials belong in server EnvVars (see DEPLOY.md)"
            exit 1
          fi
          echo "no committed .env"
