name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first — no value in finishing a run
# for a commit that has already been replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the `engines.node` floor in package.json.
          node-version: '22'
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the lock
      # and package.json disagree — which also makes a stale lockfile a CI
      # failure rather than a surprise at deploy time.
      #
      # --ignore-scripts: nothing here needs a package's postinstall, and the
      # SDK's own install scripts are unnecessary for typecheck/test/build.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # Unit tests for the storage layer. See test/server/persistence.spec.ts —
      # the credential-caching cases are a direct regression guard, and they fail
      # by TIMING OUT against the old code, because the bug made a load hang for
      # the whole server session rather than error.
      - name: Test
        run: npm test

      # The scene must actually bundle. `sdk-commands build` runs its own type
      # checker over the scene graph, which catches things `tsc -p .` alone does
      # not (composite resolution, generated script types).
      - name: Build
        run: npm run build

      # The keyed career path is behind a config flag, so the default build never
      # compiles it. Without this, a type error on that path could sit unnoticed
      # until the day someone flips the flag — which is exactly the day you least
      # want a surprise. Checks the flag's other value without committing it.
      #
      # No-ops on branches where the flag does not exist yet.
      - name: Typecheck the non-default career storage mode
        run: |
          if grep -q "CAREER_STORAGE_MODE: CareerStorageMode = 'blob'" src/shared/config.ts; then
            sed -i "s/CAREER_STORAGE_MODE: CareerStorageMode = 'blob'/CAREER_STORAGE_MODE: CareerStorageMode = 'keyed'/" src/shared/config.ts
            npm run typecheck
            git checkout -- src/shared/config.ts
          else
            echo "CAREER_STORAGE_MODE not present on this branch — nothing to check."
          fi

  # Deploy-hygiene checks that do not need the dependency tree installed.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Test files, CI config and local snapshots must never reach the content
      # server. .dclignore is the only thing preventing that, so assert it rather
      # than trusting it — a deploy that ships test/ is silent and permanent.
      - name: Deploy excludes non-scene files
        run: |
          missing=0
          for entry in 'test/' 'vitest.config.ts' 'tsconfig.test.json' '.github/' 'backups/' 'node_modules/'; do
            if ! grep -qxF "$entry" .dclignore; then
              echo "::error file=.dclignore::missing required .dclignore entry: $entry"
              missing=1
            fi
          done
          exit $missing

      # The pin carries the multiplayer server runtime, and a floating range would
      # let a stray install walk it onto an untested build. See UPGRADE-SDK.md.
      - name: SDK versions are pinned exactly
        run: |
          node -e '
            const dev = require("./package.json").devDependencies || {};
            const bad = Object.entries(dev).filter(([n, v]) =>
              n.startsWith("@dcl/") && /^[\^~]|\*|^latest$/.test(v));
            if (bad.length) {
              for (const [n, v] of bad) {
                console.error(`::error file=package.json::${n} must be an exact version, got "${v}"`);
              }
              process.exit(1);
            }
            console.log("all @dcl/* dependencies are exact pins");
          '

      # Credentials belong in world-scoped EnvVars, never in the repo. There is no
      # .env here by design and .gitignore does not list one, so a committed .env
      # would ship straight to the content server.
      - name: No committed environment file
        run: |
          if ls -A .env .env.* 2>/dev/null | grep -q .; then
            echo "::error::an environment file is committed — credentials belong in server EnvVars (see DEPLOY.md)"
            exit 1
          fi
          echo "no committed .env"
